spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vector_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
  ai:
    chat:
      client:
        enabled: false   # Multiple ChatClients are defined ourselves
    openai:
      api-key: ${AI_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: hnsw
        table-name: embeddings

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

ai:
  models:
    smart:
      id: gpt-4.1
      temperature: 1.0
    cheap:
      id: gpt-5-mini
      temperature: 1.0
